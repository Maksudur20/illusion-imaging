<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Royal Gold Gradient -->
    <linearGradient id="iiGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="25%" stop-color="#F5D061" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996E14" />
    </linearGradient>

    <!-- Medical Tech Cyan Gradient -->
    <linearGradient id="iiCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#034575" />
    </linearGradient>

    <!-- Deep Luxury Base -->
    <linearGradient id="iiBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1A2F" />
      <stop offset="60%" stop-color="#08101E" />
      <stop offset="100%" stop-color="#040810" />
    </linearGradient>

    <!-- Core Energy Glow -->
    <radialGradient id="iiCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#D4AF37" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#08101E" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="iiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Royal Background Squircle -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#iiBaseGrad)" stroke="url(#iiGoldGrad)" stroke-width="2.5" />
  
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="104" height="104" rx="22" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Background Ambient Glow -->
  <circle cx="60" cy="60" r="38" fill="url(#iiCenterGlow)" />

  <!-- Outer Solar Radiance Flares (8 Directions) -->
  <!-- Cardinal Long Rays -->
  <path d="M60 14 L62.5 24 L60 21 L57.5 24 Z" fill="url(#iiGoldGrad)" />
  <path d="M60 106 L62.5 96 L60 99 L57.5 96 Z" fill="url(#iiGoldGrad)" />
  <path d="M14 60 L24 62.5 L21 60 L24 57.5 Z" fill="url(#iiGoldGrad)" />
  <path d="M106 60 L96 62.5 L99 60 L96 57.5 Z" fill="url(#iiGoldGrad)" />

  <!-- Diagonal Rays -->
  <path d="M27.5 27.5 L34 32 L32 34 Z" fill="url(#iiCyanGrad)" />
  <path d="M92.5 27.5 L86 32 L88 34 Z" fill="url(#iiCyanGrad)" />
  <path d="M27.5 92.5 L34 88 L32 86 Z" fill="url(#iiCyanGrad)" />
  <path d="M92.5 92.5 L86 88 L88 86 Z" fill="url(#iiCyanGrad)" />

  <!-- Precision Medical Scanner Outer Optical Ring -->
  <circle cx="60" cy="60" r="39" fill="none" stroke="rgba(212, 175, 55, 0.3)" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="60" cy="60" r="34" fill="none" stroke="url(#iiCyanGrad)" stroke-width="2" opacity="0.85" />

  <!-- Scanner Iris Aperture Blades (Representing Medical Imaging Optics + Solar Photons) -->
  <g opacity="0.45" stroke="url(#iiGoldGrad)" stroke-width="1.2" fill="none">
    <path d="M60 26 C75 26 88 35 92 48" />
    <path d="M94 60 C94 75 85 88 72 92" />
    <path d="M60 94 C45 94 32 85 28 72" />
    <path d="M26 60 C26 45 35 32 48 28" />
  </g>

  <!-- Central Emblem: Fusion of Royal Sunburst & High-Tech Medical "II" / Diamond Iris -->
  <!-- Outer Diamond Focus -->
  <polygon points="60,28 88,60 60,92 32,60" fill="none" stroke="url(#iiGoldGrad)" stroke-width="2" />
  <polygon points="60,33 83,60 60,87 37,60" fill="rgba(6, 182, 212, 0.08)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />

  <!-- Center Double "I" Royal High-Tech Monogram -->
  <!-- Left Pillar: Illusion (Solar Gold) -->
  <g fill="url(#iiGoldGrad)">
    <!-- Top serif -->
    <path d="M47 43 L55 43 L55 46 L52.5 46 L52.5 74 L55 74 L55 77 L47 77 L47 74 L49.5 74 L49.5 46 L47 46 Z" />
    <!-- Diamond Crown on 1st I -->
    <polygon points="51,37 53,39.5 51,42 49,39.5" />
  </g>

  <!-- Right Pillar: Imaging (Diagnostic Cyan/White) -->
  <g fill="url(#iiCyanGrad)">
    <!-- Top serif -->
    <path d="M65 43 L73 43 L73 46 L70.5 46 L70.5 74 L73 74 L73 77 L65 77 L65 74 L67.5 74 L67.5 46 L65 46 Z" />
    <!-- Radiant Optics Lens Dot on 2nd I -->
    <circle cx="69" cy="39.5" r="2.2" fill="#E0F2FE" />
    <circle cx="69" cy="39.5" r="1" fill="#0284C7" />
  </g>

  <!-- Center Connecting Nexus: Solar Photon Diamond (Binding Solar + Medical Together) -->
  <polygon points="60,54 63,60 60,66 57,60" fill="#FFFFFF" filter="url(#iiGlow)" />
  <polygon points="60,55.5 62,60 60,64.5 58,60" fill="url(#iiGoldGrad)" />

  <!-- Precision Corner Tech Accents -->
  <circle cx="15" cy="15" r="1.5" fill="#D4AF37" opacity="0.6" />
  <circle cx="105" cy="15" r="1.5" fill="#38BDF8" opacity="0.6" />
  <circle cx="15" cy="105" r="1.5" fill="#38BDF8" opacity="0.6" />
  <circle cx="105" cy="105" r="1.5" fill="#D4AF37" opacity="0.6" />
</svg>
